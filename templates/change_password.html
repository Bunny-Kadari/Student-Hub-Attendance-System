<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendora | Change Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light d-flex align-items-center justify-content-center min-vh-100"><main class="card shadow p-4" style="width:min(440px,94vw)"><h3>Change Password</h3>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" required><label class="form-label">New password (10+ characters)</label><input class="form-control mb-3" type="password" name="new_password" minlength="10" required><label class="form-label">Confirm new password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="10" required><button class="btn btn-primary w-100">Update Password</button></form><a href="/" class="btn btn-link mt-2">Home</a></main></body></html>
