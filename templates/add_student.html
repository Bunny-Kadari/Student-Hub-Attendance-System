<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #e3f2fd, #ffffff);
        }
        .card {
            border-radius: 15px;
        }
        button:hover {
            transform: scale(1.03);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg border-0 col-md-6 mx-auto">
        <div class="card-body p-5">

            <h2 class="text-center text-primary mb-4">
                🎓 Add New Student
            </h2>

            {% if message %}
            <div class="alert alert-info text-center">
                {{ message }}
            </div>
            {% endif %}

            <!-- IMPORTANT -->
            <form method="POST" enctype="multipart/form-data">
            


                <div class="mb-3">
                    <label class="form-label">Hub ID</label>
                    <input type="text" name="hub_id" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department ID</label>
                    <input type="number" name="dept_id" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Semester</label>
                    <input type="number" name="semester" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Section</label>
                    <input type="text" name="section" class="form-control" required>
                </div>

                <!-- FILE UPLOAD -->
                <div class="mb-4">
                    <label class="form-label">Upload Student Photo</label>
                    <input type="file" name="photo" id="photoInput" class="form-control" accept="image/*" required>
                </div>

                <hr>
                <h5 class="text-center">📸 Or Capture from Camera</h5>

                <video id="video" width="100%" autoplay class="mb-3 rounded border"></video>
                <button type="button" class="btn btn-primary w-100 mb-3" onclick="capture()">Capture Photo</button>

                <canvas id="canvas" style="display:none;"></canvas>

                <button type="submit" class="btn btn-success w-100">
                    ➕ Add Student
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="/dashboard" class="btn btn-secondary btn-sm">
                    ⬅ Back to Dashboard
                </a>
            </div>

        </div>
    </div>

</div>

<script>
let video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
});

function capture() {

    let canvas = document.getElementById("canvas");
    let context = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    context.drawImage(video, 0, 0);

    canvas.toBlob(function(blob) {

        let file = new File([blob], "camera.jpg", { type: "image/jpeg" });

        let container = new DataTransfer();
        container.items.add(file);

        document.getElementById("photoInput").files = container.files;

        alert("Photo Captured Successfully ✅");

    }, "image/jpeg");
}
</script>

</body>
</html>
