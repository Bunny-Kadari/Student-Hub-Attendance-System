<!DOCTYPE html>
<html>
<head>
<title>Success</title>
<meta http-equiv="refresh" content="2;url=/dashboard">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.btn-dark {
    box-shadow: 0 5px #000;
    transition: 0.2s;
}

.btn-dark:active {
    box-shadow: 0 2px #000;
    transform: translateY(3px);
}
</style>
</head>

<body class="bg-success d-flex justify-content-center align-items-center" style="height:100vh;">
<button onclick="toggleMode()" 
        class="btn btn-light position-absolute top-0 end-0 m-3">
    🌙
</button>

<div class="text-center text-white">
    <h1>Login Successful!</h1>
    <div class="spinner-border mt-3"></div>
    <p class="mt-3">Redirecting to Dashboard...</p>
</div>

</body>
<script>
function toggleMode() {
    document.body.classList.toggle("bg-dark");
    document.body.classList.toggle("text-white");
}
</script>

</html>
