<!DOCTYPE html>
<html>
<head>
    <title>Manual Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-4">
    <a href="/dashboard" class="btn btn-light">⬅ Dashboard</a>
    <span class="navbar-brand mx-auto">📝 Manual Attendance</span>
</nav>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        {% if success %}
        <div class="alert alert-success">
            Attendance Saved Successfully ✅
        </div>
        {% endif %}

        {% if students|length == 0 %}
        <div class="alert alert-danger">
            No students found in database ❌
        </div>
        {% endif %}

        <form method="POST">

            <!-- Date -->
            <div class="mb-3">
                <label class="form-label fw-bold">Select Date</label>
                <input type="date" name="date" class="form-control w-25" required>
            </div>

            <!-- Table -->
            <div class="table-responsive">

                <button type="button"
                        class="btn btn-outline-success mb-3"
                        onclick="markAllPresent()">
                    Mark All Present
                </button>

                <table class="table table-bordered text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Student Name</th>
                            <th>Present</th>
                            <th>Absent</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td class="fw-semibold">
                                {{ student.name }}
                            </td>

                            <td>
                                <input type="radio"
                                       name="status_{{ student.id }}"
                                       value="Present"
                                       required>
                            </td>

                            <td>
                                <input type="radio"
                                       name="status_{{ student.id }}"
                                       value="Absent">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>

            </div>

            <div class="text-center mt-4">
                <button type="submit"
                        class="btn btn-success btn-lg px-5">
                    Save Attendance
                </button>
            </div>

        </form>

    </div>

</div>

<script>
function markAllPresent() {
    const radios = document.querySelectorAll("input[value='Present']");
    radios.forEach(radio => radio.checked = true);
}
</script>

</body>
</html>
