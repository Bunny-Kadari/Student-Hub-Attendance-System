<!DOCTYPE html>
<html>
<head>
    <title>Faculty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #e3f2fd, #ffffff);
        }

        .main-card {
            border-radius: 20px;
            padding: 40px;
            background: white;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
        }

        .subject-card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(0,0,0,0.15);
        }

        .navbar {
            background: linear-gradient(to right, #0d6efd, #0a58ca);
        }

        .btn-custom {
            border-radius: 30px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <a href="/" class="btn btn-light btn-sm">🏠 Home</a>
    <span class="navbar-brand mx-auto fs-4">
        🎓 Welcome {{ username }}
    </span>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</nav>

<div class="container mt-5">
    <div class="main-card">

        <h2 class="text-center text-primary mb-4">📚 Your Subjects</h2>

        <div class="row">
            {% for class in classes %}
            <div class="col-md-4 mb-4">
                <div class="card subject-card shadow text-center p-3">

                    <h5 class="text-success">{{ class.subject_name }}</h5>

  <a href="/attendance/{{ class.id }}" class="btn btn-primary btn-custom w-100 mt-2">
    ✏ Take Attendance
</a>

<a href="/view_report/{{ class.id }}" class="btn btn-success btn-custom w-100 mt-2">
    📊 View Report
</a>

<a href="/start_ai/{{ class.id }}" class="btn btn-warning btn-custom w-100 mt-2">
    🤖 AI Attendance
</a>


                </div>
            </div>
            {% endfor %}
        </div>

        <!-- 🔥 HEAD OPTIONS -->
        {% if role == "head" %}
        <div class="text-center mt-4">

            <a href="/add_student" class="btn btn-dark btn-lg btn-custom me-3">
                ➕ Add Student
            </a>

            <a href="/students" class="btn btn-info btn-lg btn-custom">
                📊 View All Students
            </a>

        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
