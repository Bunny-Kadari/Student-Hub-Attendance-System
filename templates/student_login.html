<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendora | Student Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-success-subtle d-flex align-items-center justify-content-center min-vh-100"><main class="card shadow p-4" style="width:min(420px,94vw)"><h3 class="text-center mb-3">Student Login</h3>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Hub ID</label><input class="form-control mb-3" name="hub_id" required autocomplete="username"><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required autocomplete="current-password"><button class="btn btn-success w-100">Login</button></form><a href="/" class="btn btn-link mt-2">Home</a></main></body></html>
