<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .login-card {
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: scale(1.03);
        }

        .home-btn {
            transition: 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center" style="height:100vh;">

<div class="text-center mb-4 text-white">
    <i class="bi bi-mortarboard-fill" style="font-size:50px;"></i>
    <h2>RGUKT Smart Attendance</h2>
</div>

<div class="card p-4 shadow-lg login-card" style="width:400px;">
    <h4 class="text-center mb-3">
        <i class="bi bi-person-fill"></i> Student Login
    </h4>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Hub ID</label>
            <input type="text" name="hub_id" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-dark w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
    </form>

    {% if error %}
        <p class="text-danger mt-2 text-center">{{ error }}</p>
    {% endif %}
</div>

<div class="mt-4">
    <a href="/" class="btn btn-light btn-lg shadow home-btn">
        <i class="bi bi-house-door-fill"></i> Home
    </a>
</div>

</body>
</html>
