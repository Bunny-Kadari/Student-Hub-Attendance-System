<!DOCTYPE html>
<html>
<head>
    <title>Attendora | Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="text-center text-primary mb-4">Edit Student</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Semester</label>
                <input type="number" name="semester" value="{{ student.semester }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Section</label>
                <input type="text" name="section" value="{{ student.section }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Upload Photo</label>
                <input type="file" name="photo" class="form-control">
            </div>

            <div class="alert alert-info">
                Update the student's section here (for example, c4). Face recognition registration is managed separately using the "Register / Update Face" button in the Admin Panel.
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">
                    Update Student
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
