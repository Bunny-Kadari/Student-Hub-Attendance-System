<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendora | Student List</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card shadow-sm"><div class="card-body"><h2 class="mb-4">Student List</h2><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Photo</th><th>Hub ID</th><th>Name</th><th>Department</th><th>Semester</th><th>Section</th><th>Actions</th></tr></thead><tbody>{% for student in students %}<tr><td><img src="{{ url_for('static', filename='known_faces/' + student['hub_id'] + '.jpg') }}" width="48" height="48" class="rounded-circle" onerror="this.style.display='none'"></td><td>{{ student.hub_id }}</td><td>{{ student.name }}</td><td>{{ student.dept_name or '—' }}</td><td>{{ student.semester }}</td><td>{{ student.section }}</td><td><a href="/edit_student/{{ student.id }}" class="btn btn-sm btn-warning">Edit</a> <form method="post" action="/delete_student/{{ student.id }}" class="d-inline" onsubmit="return confirm('Delete this student and attendance?')"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="7">No students have been added.</td></tr>{% endfor %}</tbody></table></div><a href="/admin" class="btn btn-secondary">Back to Admin</a></div></div></main></body></html>
