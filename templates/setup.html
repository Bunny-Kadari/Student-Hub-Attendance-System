<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendora | Initial Admin Setup</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-dark d-flex align-items-center justify-content-center min-vh-100"><main class="card shadow p-4" style="width:min(440px,94vw)"><h3 class="mb-2">Create your Admin account</h3><p class="text-muted">One-time setup. You choose the username and password. Public setup closes after the first Admin is created.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Private setup token</label><input class="form-control mb-3" type="password" name="setup_token" required autocomplete="off"><label class="form-label">Admin username</label><input class="form-control mb-3" name="username" minlength="4" required autocomplete="username"><label class="form-label">Password (10+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="10" required autocomplete="new-password"><label class="form-label">Confirm password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="10" required autocomplete="new-password"><button class="btn btn-primary w-100">Create Admin</button></form></main></body></html>
