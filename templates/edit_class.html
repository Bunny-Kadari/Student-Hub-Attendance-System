<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendora | Edit Class Allocation</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:720px"><div class="card-body p-4"><h3 class="mb-3">Edit Class Allocation</h3>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Subject Code</label><input class="form-control mb-3" name="subject_code" value="{{ class_row.subject_code }}" required><label class="form-label">Subject Name</label><input class="form-control mb-3" name="subject_name" value="{{ class_row.subject_name }}" required><label class="form-label">Department</label><select class="form-select mb-3" name="dept_id" required>{% for d in departments %}<option value="{{ d.id }}" {% if d.id==class_row.dept_id %}selected{% endif %}>{{ d.dept_name }}</option>{% endfor %}</select><label class="form-label">Semester</label><input class="form-control mb-3" type="number" min="1" max="8" name="semester" value="{{ class_row.semester }}" required><label class="form-label">Section</label><input class="form-control mb-3" name="section" value="{{ class_row.section or '' }}"><label class="form-label">Assigned Faculty</label><select class="form-select mb-4" name="faculty_id" required>{% for f in faculty %}<option value="{{ f.id }}" {% if f.id==class_row.faculty_id %}selected{% endif %}>{{ f.username }}</option>{% endfor %}</select><button class="btn btn-primary">Save Changes</button> <a class="btn btn-secondary" href="/admin">Cancel</a></form></div></div></main></body></html>
