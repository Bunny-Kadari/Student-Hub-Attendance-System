<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 10s infinite ease-in-out;
        }

        .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 15%; }
        .circle:nth-child(2) { width: 300px; height: 300px; bottom: 10%; right: 10%; }
        .circle:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 70%; }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .login-card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            color: white;
            padding: 30px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .login-card:hover {
            transform: scale(1.03);
        }

        .form-control {
            background: rgba(255,255,255,0.8);
        }

        .btn-dark {
            box-shadow: 0 5px #000;
            transition: 0.2s;
        }

        .btn-dark:active {
            box-shadow: 0 2px #000;
            transform: translateY(3px);
        }

        .home-btn {
            transition: 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<button onclick="toggleMode()" 
        class="btn btn-light position-absolute top-0 end-0 m-3">
    🌙
</button>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="text-center mb-4 text-white">
    <i class="bi bi-mortarboard-fill" style="font-size:50px;"></i>
    <h2>RGUKT Smart Attendance</h2>
</div>

<div class="login-card">
    <h4 class="text-center mb-3">
        <i class="bi bi-person-fill"></i> Student Login
    </h4>

    <form method="POST">
        <div class="mb-3">
            <input type="text" name="hub_id" class="form-control" placeholder="Hub ID" required>
        </div>

        <button type="submit" class="btn btn-dark w-100" id="loginBtn">
            <span id="btnText">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </span>
            <span id="spinner" class="spinner-border spinner-border-sm d-none"></span>
        </button>
    </form>

    {% if error %}
        <p class="text-warning mt-2 text-center">{{ error }}</p>
    {% endif %}
</div>

<div class="mt-4">
    <a href="/" class="btn btn-light btn-lg shadow home-btn">
        <i class="bi bi-house-door-fill"></i> Home
    </a>
</div>

<script>
document.querySelector("form").addEventListener("submit", function() {
    document.getElementById("btnText").classList.add("d-none");
    document.getElementById("spinner").classList.remove("d-none");
});

function toggleMode() {
    document.body.classList.toggle("bg-dark");
    document.body.classList.toggle("text-white");
}
</script>

</body>
</html>
